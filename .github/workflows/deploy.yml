name: Deploy

on:
  push:
    branches: [main]

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: prepper-web

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Deploy to EC2
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: ECR_REGISTRY,ECR_REPOSITORY,AWS_REGION
          script: |
            # ECR 로그인
            aws ecr get-login-password --region $AWS_REGION | \
              docker login --username AWS --password-stdin $ECR_REGISTRY

            # SSM에서 환경변수 가져와서 임시 파일에 저장
            aws ssm get-parameters-by-path \
              --path "/prepper/" \
              --with-decryption \
              --region $AWS_REGION \
              --output json | \
              jq -r '.Parameters[] | "\(.Name | split("/") | last)=\(.Value)"' \
              > /tmp/prepper.env

            # 최신 이미지 pull 후 컨테이너 교체
            docker pull $ECR_REGISTRY/$ECR_REPOSITORY:latest
            docker stop prepper-web 2>/dev/null || true
            docker rm   prepper-web 2>/dev/null || true
            docker run -d \
              --name prepper-web \
              -p 3000:3000 \
              --env-file /tmp/prepper.env \
              --restart unless-stopped \
              $ECR_REGISTRY/$ECR_REPOSITORY:latest

            rm -f /tmp/prepper.env
            docker image prune -f
